fetch_dataset:
  # One-time step: HuggingFace -> local file -> S3 bucket (make_dataset reads it from S3)
  HF_REPO: scikit-learn/churn-prediction
  LOCAL_FILE: data/raw/Telco-Customer-Churn.csv
  S3_BUCKET: ibm-churn-project-s3-bucket
  S3_KEY: Telco-Customer-Churn.csv

make_dataset:
  S3_BUCKET: ibm-churn-project-s3-bucket
  S3_KEY: Telco-Customer-Churn.csv
  DROP_COLUMNS: [customerID]

validate_data:
  REQUIRED_COLUMNS: [gender, SeniorCitizen, Partner, Dependents, tenure, PhoneService, MultipleLines, InternetService, OnlineSecurity, OnlineBackup, DeviceProtection, TechSupport, StreamingTV, StreamingMovies, Contract, PaperlessBilling, PaymentMethod, MonthlyCharges, TotalCharges, Churn]
  MIN_ROWS: 1000
  MIN_TENURE: 0
  MAX_TENURE: 100
  MIN_MONTHLY_CHARGES: 0
  ALLOWED_CHURN_VALUES: ["Yes", "No"]
  MAX_NULL_SHARE: 0.05

build_features:
  TARGET: Churn
  TEST_SIZE: 0.2
  RANDOM_STATE: 42
  SERVICE_COLUMNS: [PhoneService, MultipleLines, InternetService, OnlineSecurity, OnlineBackup, DeviceProtection, TechSupport, StreamingTV, StreamingMovies]
  NO_SERVICE_VALUES: ["No", "No internet service", "No phone service"]

check_drift:
  # Warning only: the pipeline keeps running, the report says if drift was found
  MAX_MONTHLY_CHARGES_MEAN_CHANGE: 0.20
  MAX_CHURN_SHARE_CHANGE: 0.10

train_model:
  TARGET: Churn
  RANDOM_STATE: 42
  CV_FOLDS: 5

tune_model:
  TARGET: Churn
  RANDOM_STATE: 42
  CV_FOLDS: 3
  SCORING: f1
  # Only the winner of train_model is tuned (GridSearchCV), using its own grid
  PARAM_GRIDS:
    Logistic Regression:
      classifier__C: [0.01, 0.1, 1, 10]
    Decision Tree:
      classifier__max_depth: [3, 5, 10, null]
      classifier__min_samples_split: [2, 5, 10]
    Random Forest:
      classifier__n_estimators: [100, 200]
      classifier__max_depth: [8, 12, null]
      classifier__min_samples_leaf: [1, 3]
    Gradient Boosting:
      classifier__n_estimators: [100, 200]
      classifier__max_depth: [2, 3]
      classifier__learning_rate: [0.05, 0.1]

evaluate_model:
  TARGET: Churn
  REGISTERED_MODEL_NAME: churn_model

quality_gate:
  MIN_TEST_ACCURACY: 0.70
  MIN_TEST_F1: 0.55

mlflow:
  TRACKING_URI: https://dagshub.com/Shahzaibabdulkhaliq0/IBM-Churn-BinaryClass_Classification.mlflow
  EXPERIMENT_NAME: IBM-Churn-Prediction
