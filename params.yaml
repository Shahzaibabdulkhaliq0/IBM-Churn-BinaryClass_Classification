fetch_dataset:
  hf_repo: scikit-learn/churn-prediction
  raw_path: data/raw/churn.csv

data:
  hf_repo: scikit-learn/churn-prediction
  raw_path: data/raw/churn.csv
  processed_path: data/processed/churn_clean.csv
  drop_cols:
    - customerID

features:
  target: Churn
  service_cols:
    - PhoneService
    - MultipleLines
    - InternetService
    - OnlineSecurity
    - OnlineBackup
    - DeviceProtection
    - TechSupport
    - StreamingTV
    - StreamingMovies
  no_service_values:
    - "No"
    - "No internet service"
    - "No phone service"

split:
  test_size: 0.2
  random_state: 42

validate:
  target: Churn
  allowed_target_values:
    - "Yes"
    - "No"
  min_rows: 1000
  expected_columns:
    - gender
    - SeniorCitizen
    - Partner
    - Dependents
    - tenure
    - PhoneService
    - MultipleLines
    - InternetService
    - OnlineSecurity
    - OnlineBackup
    - DeviceProtection
    - TechSupport
    - StreamingTV
    - StreamingMovies
    - Contract
    - PaperlessBilling
    - PaymentMethod
    - MonthlyCharges
    - TotalCharges
    - Churn

drift:
  baseline_path: reports/baseline_stats.json
  current_path: data/processed/test.csv
  report_path: reports/drift_report.json
  threshold: 0.1

train:
  cv_folds: 5
  scoring: f1
  rf_n_estimators: 200
  random_state: 42

tune:
  cv_folds: 3
  scoring: f1
  random_state: 42
  logistic_regression:
    C: [0.01, 0.1, 1, 10]
  random_forest:
    n_estimators: [100, 200, 400]
    max_depth: [null, 5, 10, 20]
    min_samples_leaf: [1, 2, 5]

mlflow:
  TRACKING_URI: https://dagshub.com/Shahzaibabdulkhaliq0/IBM-Churn-BinaryClass_Classification.mlflow
  EXPERIMENT_NAME: IBM-Churn-Prediction