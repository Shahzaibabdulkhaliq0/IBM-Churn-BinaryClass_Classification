# CI pipeline.
# - Every push and pull request to main: run the tests (API tests + Production model quality gate).
# - Build and push job: runs only after tests pass, on a push to main or a manual "Run workflow" click.
#   It builds the Docker image and pushes it to ECR.
# - EKS deploy steps are commented out below. They run later, after you connect EKS yourself.
# Training is NOT run here. Training runs locally with "dvc repro"; CI only uses the Production model.
name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual start from the Actions tab, so you can test the ECR push without merging to main
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy the new image to EKS (needs a running EKS cluster)"
        type: boolean
        default: false

env:
  # Region of the ECR repo and the DVC S3 bucket (both in eu-north-1)
  AWS_REGION: eu-north-1
  # ECR repository name. The account ID is NOT written here: the ECR login step finds the registry address itself.
  ECR_REPOSITORY: churn-ecr-api
  # EKS names. Used only by the commented-out deploy steps at the bottom.
  EKS_CLUSTER: churn-api-cluster
  EKS_DEPLOYMENT: churn-api

jobs:
  # Job 1: tests. Runs on every push, pull request and manual start.
  test:
    runs-on: ubuntu-latest
    steps:
      # Download the repo code onto the GitHub runner
      - name: Checkout code
        uses: actions/checkout@v4

      # Install the Python version used in the Dockerfile
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-api.txt
            requirements-dev.txt

      # Install project packages and test packages
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      # Log in to AWS using GitHub Secrets (needed for DVC to read data from S3)
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # The quality gate test needs the test split file, which is stored in S3 by DVC
      - name: Pull test data from S3 (DVC)
        run: dvc pull data/processed/test.csv

      # Fast tests: the API works with a small fake model (no network needed)
      - name: API tests
        run: pytest -q --ignore=tests/test_model_quality.py

      # Slow test: the real Production model from DagsHub must pass the quality gate
      - name: Model quality gate (Production model)
        env:
          DAGSHUB_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        run: pytest -q tests/test_model_quality.py

  # Job 2: build and push the image to ECR. Runs only after tests pass.
  build-and-push:
    needs: test
    # Runs on a push to main, or when you click "Run workflow" by hand. Never on pull requests.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-api.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Pull all DVC outputs from S3 (including models/feature_config.json, used by the API).
      # A single path target ("dvc pull models/feature_config.json") did not match the DVC file in CI, so we pull everything.
      - name: Pull DVC outputs from S3
        run: dvc pull

      # Download the Production model from DagsHub and save it to models/best_model.joblib.
      # The Docker image copies this file in, so the image always matches the Production model.
      - name: Export Production model from registry
        env:
          DAGSHUB_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        run: python scripts/export_production_model.py

      # Log in to ECR so Docker can push the image there. The "registry" output is your ECR address.
      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Build the image and tag it twice: with the commit SHA (for rollback) and with "latest"
      # Build the image first. Nothing is pushed yet.
      - name: Build Docker image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          docker build -t "$REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA" -t "$REGISTRY/$ECR_REPOSITORY:latest" .

      # Smoke test: start the container and check /health. If the app does not start, the job fails and nothing is pushed.
      - name: Smoke test the container
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          docker run -d --name smoke -p 8000:8000 "$REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA"
          # Wait up to ~30 seconds for /health to answer with status ok
          for i in $(seq 1 15); do
            if curl -sf http://127.0.0.1:8000/health | grep -q '"status":"ok"'; then
              echo "Health check passed"
              docker rm -f smoke
              exit 0
            fi
            sleep 2
          done
          echo "Health check FAILED. Container logs:"
          docker logs smoke
          docker rm -f smoke
          exit 1

      # Push the tested image to ECR (SHA tag and latest tag)
      - name: Push Docker image to ECR
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          docker push "$REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA"
          docker push "$REGISTRY/$ECR_REPOSITORY:latest"

